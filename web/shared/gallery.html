<script type="module">
/* Static gallery for the shared components. It needs no backend: every value
   here is made up. Open it from a static server and look at it at desktop and

];

const deviceSource = {
  thumbUrl: () => null,
  // Pretend the file lands in the playlist folder after a short upload.
  upload: (file, onProgress) => new Promise((resolve) => {
    let p = 0;
    const t = setInterval(() => {
      p += 0.2;
      onProgress(Math.min(p, 1));
      if (p >= 1) { clearInterval(t); resolve({ file: file.name, name: file.name, duration: 10 }); }
    }, 120);
  }),
};

const serverSource = {
  thumbUrl: () => null,
  list: async () => LIBRARY,
};

/* ----------------------------------------------------------------- shell */

const NAV = [
  { id: 'foundations', label: 'Foundations' },
  { id: 'buttons', label: 'Buttons' },
  { id: 'badges', label: 'Badges' },
  { id: 'banners', label: 'Banners' },
  { id: 'forms', label: 'Forms' },
  { id: 'tables', label: 'Tables' },
  { id: 'cards', label: 'Cards' },
  { id: 'overlays', label: 'Modal and toast' },

/* --------------------------------------------------------------- helpers */

function page(title, lead, ...blocks) {
  return [
    h('div', { class: 'pp-page-head' },
      h('div', null, h('h1', { class: 'pp-h1', text: title }), lead ? h('p', { class: 'pp-lead' }, lead) : null),
      h('div', { class: 'pp-status' }, statusDot('ok'), h('span', { text: 'Screen on · playing' }))),
    ...blocks,
  ];
}

function section(title, ...kids) {
  return h('div', { style: { 'margin-bottom': '18px' } },
    h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: title }),
    h('div', { class: 'pp-card pp-card--pad' }, h('div', { class: 'pp-row', style: { gap: '10px' } }, kids)));
}

/* ------------------------------------------------------------- the pages */

function buttons() {
  const seg = (labels) => {
    let active = 0;
    const el = h('div', { class: 'pp-seg', role: 'group' });
    const draw = () => fill(el, labels.map((l, i) => h('button', {
      type: 'button', class: 'pp-seg__btn', text: l, 'aria-pressed': String(i === active),
      onClick: () => { active = i; draw(); },
    })));
    draw();
    return el;
  };
  return page('Buttons', 'Every variant and size, plus the segmented control.',
    section('Kinds',
      h('button', { class: 'pp-btn pp-btn--primary', text: 'Save playlist' }),
      h('button', { class: 'pp-btn', text: 'Cancel' }),
      h('button', { class: 'pp-btn pp-btn--danger', text: 'Change it' }),
      h('button', { class: 'pp-btn pp-btn--danger-outline', text: 'Remove this screen' }),
      h('button', { class: 'pp-btn pp-btn--warn-outline', text: 'Keep anyway' }),
      h('button', { class: 'pp-btn pp-btn--dashed' }, icon('plus'), 'Add a rule'),
      h('button', { class: 'pp-btn pp-btn--ghost', text: 'See everything →' })),
    section('Sizes and states',
      h('button', { class: 'pp-btn pp-btn--sm', text: 'Which ones?' }),
      h('button', { class: 'pp-btn', text: 'Restart player' }),
      h('button', { class: 'pp-btn pp-btn--primary', text: 'Save — 24 screens pick this up' }),
      h('button', { class: 'pp-btn', disabled: true, text: 'Save schedule' }),
      h('button', { class: 'pp-btn pp-btn--primary', disabled: true, text: 'Save playlist' }),
      h('button', { class: 'pp-btn pp-btn--icon', 'aria-label': 'Remove' }, icon('close', 14))),
    section('Segmented', seg(['Desktop', 'Phone']), seg(['List', 'Wall'])),
    section('Filter chips', ['Everything', 'Playback', 'Player', 'Screen', 'Files', 'System'].map((l, i) =>
      h('button', { class: 'pp-chip', text: l, 'aria-pressed': String(i === 0) }))));
}

}

            h('span', { class: 'pp-help' }, 'Also its address on the network: ', h('span', { class: 'pp-mono', text: 'lobby-north.local' }))),
          h('label', { class: 'pp-label pp-field' }, 'ID',

              h('option', { text: '180° upside down' }), h('option', { text: '270° portrait CCW' }))),
          h('div', { class: 'pp-field' },
            h('label', { class: 'pp-label', text: 'Volume — 100%' }),
            h('input', { class: 'pp-range', type: 'range', value: '100' }),
            h('div', { class: 'pp-help', text: 'Videos play with sound unless a playlist item is muted.' })),
          h('div', { class: 'pp-field' },
            h('label', { class: 'pp-switch' }, h('input', { type: 'checkbox', checked: true }), h('span', { text: 'Turn the screen off overnight' })),
            h('div', { class: 'pp-help', text: 'It saves the panel and some power. The nightly restart is skipped while the screen is off.' })),
          h('div', { class: 'pp-field' },

            h('div', { class: 'pp-help', text: 'Off is the safe default: you decide when a screen changes.' })),
          h('div', { class: 'pp-field' },
            h('label', { class: 'pp-label', text: 'Days' }), dayRow),
          h('div', { class: 'pp-field' },
            h('label', { class: 'pp-check' }, h('input', { type: 'checkbox', checked: true }), h('span', { text: 'Shuffle' }))),
          h('div', { class: 'pp-field' },

              h('input', { class: 'pp-input', disabled: true, value: 'Managed by the server' })))))),

    { name: 'Warehouse A', id: 'px-b71e33d0', group: 'Warehouse', seen: ago(22), now: 'Safety loop (yesterday)', temp: '61 °C', free: '1.1 GB', ver: '1.4.2', state: 'alert' },
    { name: 'Retail 14', id: 'px-31f9c0aa', group: 'Retail', seen: ago(9), now: 'Installing 1.5.0…', temp: '55 °C', free: '12.0 GB', ver: '1.4.2', state: 'busy' },
    { name: 'Meeting 3', id: 'px-0ab4e771', group: 'Meeting rooms', seen: ago(260000), now: 'Room signs', temp: '—', free: '9.8 GB', ver: '1.3.1', state: 'quiet' },

  const fleet = table({
    columns: [
      {
        key: 'name', label: 'Screen', grow: true, render: (r) => h('span', { class: 'pp-status' },
          statusDot(r.state), h('span', { text: r.name }), h('span', { class: 'pp-mono pp-muted', style: { 'font-size': '12px' }, text: r.id })),
      },

    columns: [{ key: 'a', label: 'Rule', grow: true }, { key: 'b', label: 'When', width: '160px' }],

  return page('Tables', 'One flex table. Horizontal rules only, no stripes, no column dividers.',

}

}

function overlays() {
  return page('Modal and toast', 'Every one of these is the real component.',
    section('Toasts',
      h('button', { class: 'pp-btn', text: 'Playlist saved', onClick: () => toast('Playlist saved — the screen picks it up on the next item') }),
      h('button', { class: 'pp-btn', text: 'Fleet save', onClick: () => toast('Saved — 16 screens will fetch the changes on their next check-in.') }),
      h('button', { class: 'pp-btn', text: 'Something failed', onClick: () => toast('That did not save. The stick is full.', 'danger') })),
    section('Dialogs',
      h('button', {
        class: 'pp-btn', text: 'Save this playlist?',
        onClick: () => modal({
          title: 'Save this playlist?',
          body: ['Saving rewrites ', h('span', { class: 'pp-mono', text: 'lobby-loop/playlist.toml' }),
            ' on the stick. Your items, times and settings are kept exactly as shown. Comments you typed into that file by hand will be gone.'],
          actions: [{ label: 'Cancel', value: false }, { label: 'Save and rewrite', value: true, kind: 'primary', autofocus: true }],
        }).then((ok) => ok && toast('Playlist saved — the screen picks it up on the next item')),
      }),
      h('button', {
        class: 'pp-btn', text: 'confirmDialog',
        onClick: () => confirmDialog({
          title: 'Remove this screen?',
          body: 'The token stops working, so the screen pairs again from scratch. It keeps playing what it has.',
          confirm: 'Remove it', kind: 'danger',
        }).then((ok) => toast(ok ? 'Screen removed' : 'Nothing changed')),
      }),
      h('button', {
        class: 'pp-btn pp-btn--danger-outline', text: 'typedConfirm (install to disk)',
        onClick: () => typedConfirm({
          title: 'Install onto /dev/sda?',
          body: 'Everything on that disk is written over. When it finishes, power off and pull the stick before the box boots again.',
          expect: '/dev/sda', confirm: 'Install to disk',
        }).then((ok) => toast(ok ? 'Installing — do not pull the power' : 'Nothing changed')),
      }),
      h('button', {
        class: 'pp-btn pp-btn--danger-outline', text: 'typedConfirm (unpair)',
        onClick: () => typedConfirm({
          title: 'Unpair from control.example.com?',
          body: 'Playlists and schedules come back to this page. The fleet copy stays on the stick until the space is needed.',
          expect: 'Lobby North', confirm: 'Unpair', label: 'Type the screen name ',
        }).then((ok) => toast(ok ? 'Unpaired' : 'Nothing changed')),
      })));
}

function media() {

    h('div', { class: 'pp-thumb pp-thumb--wide' },
      h('span', { class: 'pp-thumb__label' }, h('span', { class: 'pp-kind pp-kind--chip', text: m.kind === 'video' ? 'Video' : 'Image' }))),
    h('div', { class: 'pp-tile__body' },
      h('div', { class: 'pp-tile__name', text: m.name }),
      h('div', { class: 'pp-tile__meta', text: `${fmtBytes(m.size)} · 1920x1080` }),
      h('div', { class: 'pp-tile__use', text: m.use })));

  const walls = [
    { name: 'Lobby North', now: 'welcome-autumn.jpg', state: 'ok', seen: '22s ago', temp: '48 °C' },
    { name: 'Cafeteria 1', now: 'menu-board-week.png', state: 'ok', seen: '48s ago', temp: '52 °C' },
    { name: 'Warehouse A', now: 'Safety loop (yesterday)', state: 'alert', seen: '22s ago', temp: '61 °C' },
    { name: 'Meeting 3', now: 'Room signs', state: 'quiet', seen: '3 days ago', temp: '—' },

  return page('Media and the wall view', 'The same tile grid holds the media library and the fleet wall.',
    h('div', { class: 'pp-card', style: { 'margin-bottom': '14px' } },
      h('div', { class: 'pp-card__foot', style: { 'border-top': '0' } },

    h('div', { class: 'pp-h2', style: { margin: '0 0 10px' }, text: 'Media library' }),
    h('div', { class: 'pp-grid' }, [
      { ...LIBRARY[0], use: 'In 2 playlists' }, { ...LIBRARY[1], use: 'In Safety loop' },

function editor() {
  const deviceBox = h('div');
  const serverBox = h('div');
  const kioskBox = h('div');
  const pairedBox = h('div');
  const emptyBox = h('div');

  mountPlaylistEditor(deviceBox, {
    playlist: LOBBY,
    mediaSource: deviceSource,
    capabilities: {
      commentLossWarning: true, configFile: 'lobby-loop/playlist.toml', folder: 'lobby-loop',
      decode: DEVICE_CAPS, tier: 'high',
      warnPrefix: 'Might not play smoothly here.',
      warnAction: { label: 'Keep anyway', onClick: () => toast('Kept. It plays as it is.') },
    },
    onSave: async () => { await wait(400); toast('Playlist saved — the screen picks it up on the next item'); },
  });

  mountPlaylistEditor(serverBox, {
    playlist: LOBBY,
    mediaSource: serverSource,
    capabilities: {
      decode: DEVICE_CAPS, tier: 'high',
      saveLabel: 'Save — 16 screens pick this up',
      warnPrefix: '3 screens in this group may struggle with it.',
      warnAction: { label: 'Which ones?', onClick: () => toast('Retail 14, Retail 22 and Meeting 3') },
      impact: {
        text: ['Used by the ', h('strong', { text: 'Warehouse' }), ' group — 16 screens · 3.4 GB of media'],
        note: 'Changes reach screens within a minute',
      },
    },
    onSave: async () => { await wait(400); toast('Saved — 16 screens will fetch the changes on their next check-in.'); },
  });

  mountPlaylistEditor(kioskBox, {
    playlist: WINDOW_PL,
    mediaSource: deviceSource,
    capabilities: { commentLossWarning: true, configFile: 'front-window/playlist.toml', folder: 'front-window', decode: DEVICE_CAPS },
    onSave: async () => toast('Playlist saved — the screen picks it up on the next item'),
  });

  mountPlaylistEditor(pairedBox, {
    playlist: LOBBY,
    readOnly: true,
    mediaSource: serverSource,
    capabilities: { managedBy: 'control.example.com', decode: DEVICE_CAPS, folder: '_fleet/lobby-loop' },
  });

  mountPlaylistEditor(emptyBox, {
    playlist: BREAK_ROOM,
    mediaSource: deviceSource,
    capabilities: { commentLossWarning: true, configFile: 'break-room/playlist.toml', folder: 'break-room', decode: DEVICE_CAPS },
    onSave: async () => toast('Playlist saved'),
  });

  const list = h('div', { class: 'pp-card pp-col-narrow', style: { padding: '8px', flex: '0 0 244px' } },
    [['Lobby loop', '6 items · 2m 13s', true], ['Evening slow loop', '3 items · 1m 02s'], ['Front window', '1 web page · kiosk'], ['Break room', 'empty']]
      .map(([name, meta, active]) => h('button', {
        class: 'pp-nav__item', style: { padding: '9px 11px' }, 'aria-current': active ? 'page' : null,
      }, h('div', { style: { 'font-size': '13.5px', 'font-weight': active ? '600' : '400' }, text: name }),
        h('div', { class: 'pp-mono', style: { 'font-size': '12px', color: 'var(--pp-muted)', 'margin-top': '2px' }, text: meta }))),
    h('button', { class: 'pp-btn pp-btn--ghost', style: { padding: '9px 11px', 'border-top': '1px solid var(--pp-border-2)', 'margin-top': '6px', width: '100%', 'justify-content': 'flex-start' }, text: '+ New playlist' }));

  return page('Playlist editor', 'One editor. The device uploads into the playlist; the server picks from the library.',
    h('div', { class: 'pp-stack' },
      h('div', null, h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: 'Device: list and editor side by side' }),
        h('div', { class: 'pp-cards' }, list, h('div', { style: { flex: '1 1 480px', 'min-width': 'min(300px, 100%)' } }, deviceBox))),
      h('div', null, h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: 'Server: impact strip and the library picker' }), serverBox),
      h('div', null, h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: 'Single URL: kiosk mode' }), kioskBox),
      h('div', null, h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: 'Paired: read-only' }), pairedBox),
      h('div', null, h('div', { class: 'pp-h2', style: { 'margin-bottom': '10px' }, text: 'Empty playlist' }), emptyBox)));
}

function login() {
  return page('Login', 'The one page that is served before a session exists.',
    h('div', { class: 'pp-card', style: { padding: '0', overflow: 'hidden' } },
      h('div', { class: 'pp-login', style: { 'min-height': '420px', background: 'var(--pp-bg)' } },
        h('form', { class: 'pp-login__card', onSubmit: (e) => { e.preventDefault(); toast('Wrong password. Try again.', 'danger'); } },
          h('div', { class: 'pp-login__brand' },
            h('span', { class: 'pp-brand__mark' }), h('span', { class: 'pp-brand__name', text: 'PortaPixel' })),
          h('div', { class: 'pp-lead', style: { margin: '0 0 18px' } }, 'Sign in to ', h('span', { class: 'pp-mono', text: 'lobby-north.local' })),
          h('label', { class: 'pp-label pp-field' }, 'Password',
            h('input', { class: 'pp-input', type: 'password', autocomplete: 'current-password' })),
          h('button', { class: 'pp-btn pp-btn--primary pp-btn--block', style: { 'margin-top': '18px' }, text: 'Sign in' }),
          h('div', { class: 'pp-help', text: 'One administrator. The password lives in the settings file on the stick.' })))));
}

function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* ---------------------------------------------------------------- routing */

const show = (build) => () => { fill(shell.main, build()); scrollTo(0, 0); };

route({
  '': show(foundations),
  foundations: show(foundations),
  buttons: show(buttons),
  badges: show(badges),
  banners: show(banners),
  forms: show(forms),
  tables: show(tables),
  cards: show(cards),
  overlays: show(overlays),
  media: show(media),
  editor: show(editor),
  login: show(login),
});
</script>
