# One file to run the PortaPixel fleet server.
#
#   docker compose up -d
#   docker compose logs portapixel-server     # the first run prints the password
#
# The first run makes server.toml in the volume, generates the admin password, and
# prints it one time. Read it from the log above, then open the address below.
#
# Set PORTAPIXEL_PUBLIC_URL to the address that the screens and your browser use.
# Without it the admin UI answers on the loopback names only, which is the safe
# default against DNS rebinding (D46). The variable replaces public_url in the
# volume's server.toml.

services:
  portapixel-server:
    image: ghcr.io/ethanpil/portapixel-server:latest
    # To build from this repository instead of the published image:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: portapixel-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - portapixel-data:/data
    environment:
      # The address that a browser and a screen use. Change it to your own name
      # and start the container again. Until you do, open the UI on the host
      # itself at http://localhost:8080/ or through an SSH port forward.
      # A screen reads this address from its enrollment card, so "localhost" tells
      # every screen to call itself and no screen can ever enroll. The server
      # already allows the loopback names on its own, so this value exists for the
      # SCREENS. Put the name or the address of this host here.
      PORTAPIXEL_PUBLIC_URL: "http://CHANGE-ME-TO-YOUR-HOST:8080"
      # The reverse proxies that this server believes, and NOTHING else. Empty is
      # the only safe default: with a network listed here, any caller from that
      # network chooses the address that the login and enrollment rate limiters
      # count, so the five-attempt admin lock never closes. Fill this in only when
      # a proxy really is in front, and name the proxy as narrowly as you can.
      PORTAPIXEL_TRUSTED_PROXIES: ""
    # The server stops gracefully in 8 s. Docker must give it more than that, or
    # it kills the process in the middle of a download that it was protecting.
    stop_grace_period: 15s
    # There is no HTTPS here. Put a reverse proxy in front, or set tls_cert and
    # tls_key in server.toml and mount the two files. A screen sends its token on
    # every call, so plain HTTP belongs on a closed network only.

volumes:
  portapixel-data:
